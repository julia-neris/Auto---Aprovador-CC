services:
  - type: web
    name: aprovadores-cc
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 8 --timeout 0 --bind 0.0.0.0:$PORT web.app:app
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: WEB_USERNAME
        sync: false
      - key: WEB_PASSWORD
        sync: false
